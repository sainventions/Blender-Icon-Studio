<svg xmlns="http://www.w3.org/2000/svg" width="240" height="160" viewBox="0 0 240 160">
  <!-- (f) Opacity variants: group opacity over overlapping children, nested group opacity, fill-opacity, stroke-opacity, rgba(), #RRGGBBAA, opacity=0 -->
  <rect width="240" height="160" fill="#F1F5F9"/>
  <g id="group-half" opacity="0.5">
    <circle cx="50" cy="55" r="35" fill="#EF4444"/>
    <circle cx="80" cy="55" r="35" fill="#EF4444"/>
    <g id="nested" opacity="0.8">
      <rect x="40" y="95" width="50" height="30" fill="#1D4ED8"/>
    </g>
  </g>
  <circle id="fill-op" cx="160" cy="55" r="35" fill="#10B981" fill-opacity="0.6" stroke="#064E3B" stroke-width="8" stroke-opacity="0.3"/>
  <rect id="rgba" x="130" y="100" width="40" height="40" fill="rgba(124, 58, 237, 0.5)"/>
  <rect id="hex8" x="180" y="100" width="40" height="40" fill="#F59E0B80"/>
  <rect id="invisible" x="0" y="0" width="20" height="20" fill="#000" opacity="0"/>
  <rect id="hidden" x="0" y="140" width="20" height="20" fill="#000" display="none"/>
</svg>
