<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Features picosvg does not support: text, mask, filter, pattern fill, dashed stroke, nested svg -->
  <defs>
    <mask id="m"><rect width="128" height="128" fill="#fff"/><circle cx="64" cy="64" r="20" fill="#000"/></mask>
    <filter id="blur"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#0EA5E9"/></pattern>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="20" fill="#1E293B" mask="url(#m)"/>
  <circle cx="64" cy="64" r="30" fill="#F43F5E" filter="url(#blur)" opacity="0.6"/>
  <rect x="20" y="96" width="40" height="16" fill="url(#dots)"/>
  <circle cx="96" cy="32" r="16" fill="none" stroke="#FACC15" stroke-width="4" stroke-dasharray="6 4"/>
  <text x="64" y="70" font-size="20" text-anchor="middle" fill="#fff">Hi</text>
  <svg x="80" y="80" width="32" height="32" viewBox="0 0 10 10"><rect width="10" height="10" fill="#22C55E"/></svg>
</svg>
